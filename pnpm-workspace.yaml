# CRMSoft V5 — pnpm workspace configuration
# Created: 2026-04-22 (Phase 4 of V5 restructure)
#
# Replaces the npm-style "workspaces" field in root package.json, which pnpm
# ignores. This file is what pnpm actually reads for workspace discovery.

packages:
  # Apps (executables)
  - 'apps-backend/*'
  - 'apps-frontend/*'

  # Pre-V5 Shared/* packages (non-backend still in use)
  - 'Shared/common'
  - 'Shared/frontend'

  # Shared/* removed from workspace:
  #   Shared/prisma-schemas  — archived 2026-05-04 to archive/prisma-schemas-stale/
  #                            (conflicting generator outputs with canonical; see docs/PHASE_3B_PRISMA_AUDIT.md)
  #   Shared/backend/*       — removed 2026-05-04 (11 packages, 0 imports; see docs/PHASE_2_SHARED_BACKEND_AUDIT.md)

  # White Label API (separate Next.js service, stays per V5 plan)
  - 'WhiteLabel/wl-api'
