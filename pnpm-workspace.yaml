# CRMSoft V5 — pnpm workspace configuration
# Created: 2026-04-22 (Phase 4 of V5 restructure)
#
# Replaces the npm-style "workspaces" field in root package.json, which pnpm
# ignores. This file is what pnpm actually reads for workspace discovery.

packages:
  # Apps (executables)
  - 'apps-backend/*'
  - 'apps-frontend/*'

  # Pre-V5 Shared/* packages (non-backend still in use)
  - 'Shared/common'
  - 'Shared/frontend'
  - 'Shared/prisma-schemas'

  # Shared/backend/* removed from workspace 2026-05-04 (Phase 3A cleanup)
  # All 11 packages confirmed zero imports across entire codebase.
  # Files preserved on disk at Shared/backend/ for reference.
  # See: docs/PHASE_2_SHARED_BACKEND_AUDIT.md

  # White Label API (separate Next.js service, stays per V5 plan)
  - 'WhiteLabel/wl-api'
